<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .payment-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
        }

        .payment-card h2 {
            color: #1a1a1a;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .logo-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            border-radius: 24px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.05);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .app-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 24px;
            display: block;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .number-box {
            display: none;
            margin-top: 12px;
            padding: 20px;
            border-radius: 18px;
            animation: popUp 0.3s ease forwards;
        }

        @keyframes popUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .number-box.bkash-active {
            background: #fdf0f6;
            border: 2px solid #e2136e;
        }

        .number-box.nagad-active {
            background: #fff3f0;
            border: 2px solid #ff3b30;
        }

        .box-title {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            margin-bottom: 8px;
        }

        .num-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .phone-number {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .bkash-active .phone-number { color: #e2136e; }
        .nagad-active .phone-number { color: #ff3b30; }

        .badge {
            background: #222;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
        }

        .btn-copy {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .bkash-active .btn-copy { background: #e2136e; }
        .nagad-active .btn-copy { background: #ff3b30; }

        .btn-copy:hover {
            opacity: 0.9;
        }

        .toast-msg {
            visibility: hidden;
            min-width: 220px;
            background-color: #111;
            color: #fff;
            text-align: center;
            border-radius: 30px;
            padding: 12px 24px;
            position: fixed;
            z-index: 99;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }

        .toast-msg.show {
            visibility: visible;
            animation: fadeInOut 2s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; bottom: 20px; }
            20% { opacity: 1; bottom: 30px; }
            80% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="payment-card">
        <h2>পেমেন্ট মেথড নির্বাচন করুন</h2>

        <div class="logo-group">
            <button class="icon-btn" onclick="openPayment('bkash')">
                <img src="bkash_logo.png" alt="bKash Original" class="app-logo">
            </button>

            <button class="icon-btn" onclick="openPayment('nagad')">
                <img src="nagad_logo.png" alt="Nagad Original" class="app-logo">
            </button>
        </div>

        <div id="bkash-info" class="number-box bkash-active">
            <div class="box-title">bKash Personal Number</div>
            <div class="num-wrapper">
                <span class="phone-number">01301470686</span>
                <span class="badge">Personal</span>
            </div>
            <button class="btn-copy" onclick="copyToClipboard('01301470686')">নম্বর কপি করুন</button>
        </div>

        <div id="nagad-info" class="number-box nagad-active">
            <div class="box-title">Nagad Personal Number</div>
            <div class="num-wrapper">
                <span class="phone-number">01806097369</span>
                <span class="badge">Personal</span>
            </div>
            <button class="btn-copy" onclick="copyToClipboard('01806097369')">নম্বর কপি করুন</button>
        </div>
    </div>

    <div id="toast" class="toast-msg">নম্বর সফলভাবে কপি করা হয়েছে!</div>

    <script>
        function openPayment(provider) {
            document.getElementById('bkash-info').style.display = 'none';
            document.getElementById('nagad-info').style.display = 'none';

            if (provider === 'bkash') {
                document.getElementById('bkash-info').style.display = 'block';
            } else if (provider === 'nagad') {
                document.getElementById('nagad-info').style.display = 'block';
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "toast-msg show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2000);
            });
        }
    </script>
</body>
</html>
