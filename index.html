<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bKash & Nagad Payment Integration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Payment Section Wrapper -->
    <div class="payment-container">
        <h3>পেমেন্ট মেথড নির্বাচন করুন</h3>
        
        <div class="payment-buttons">
            <!-- bKash Button -->
            <button type="button" class="payment-btn bkash-btn" onclick="showPaymentNumber('bkash')">
                <img src="https://raw.githubusercontent.com/bKash-Developer/bKash-merchant-API-documents/master/assets/bkash_logo.png" alt="bKash" class="payment-icon">
                <span>bKash</span>
            </button>

            <!-- Nagad Button -->
            <button type="button" class="payment-btn nagad-btn" onclick="showPaymentNumber('nagad')">
                <img src="https://download.logo.wine/logo/Nagad/Nagad-Logo.wine.png" alt="Nagad" class="payment-icon">
                <span>Nagad</span>
            </button>
        </div>

        <!-- Number Display Area -->
        <div id="payment-details" class="payment-details" style="display: none;">
            <p id="payment-text"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
